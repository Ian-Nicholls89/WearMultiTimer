name: Release

# Push a tag like v0.1 to build a signed APK and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app's version
        run: |
          name=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match appVersionName=$name in gradle.properties"
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WMT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The WMT_KEYSTORE_BASE64 secret isn't set - see the README"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "WMT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build the signed release
        env:
          WMT_KEYSTORE_PASSWORD: ${{ secrets.WMT_KEYSTORE_PASSWORD }}
          WMT_KEY_ALIAS: ${{ secrets.WMT_KEY_ALIAS }}
          WMT_KEY_PASSWORD: ${{ secrets.WMT_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease -PrequireReleaseKey

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "WearMultiTimer-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "WearMultiTimer-$GITHUB_REF_NAME.apk" \
            --title "WearMultiTimer $GITHUB_REF_NAME" --generate-notes
